<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@omfy 論点マップ 俯瞰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="common.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="common.js"></script>
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px clamp(12px,2vw,20px);border-bottom:1px solid var(--rule2);background:var(--surface);position:relative;z-index:3}
.topbar h1{font-size:18px;white-space:nowrap}
.ctrl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ctrl select,.ctrl input{font:inherit;font-size:13px;padding:3px 8px;border:1px solid var(--rule2);border-radius:6px;background:var(--surface);color:var(--ink)}
.ctrl input{width:11em}
.topbar .meta{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.stage{position:relative;flex:1;min-height:0}
#canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#canvas.dragging{cursor:grabbing}
#canvas .node.dim{opacity:.18}
#canvas .node.match circle.core{stroke:var(--accent);stroke-width:3}
#canvas .edge.dim{opacity:.25}
#canvas .fold{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2.5 2.5}
#canvas .ring{fill:none;stroke:var(--rule);stroke-width:1;stroke-dasharray:1 5}
#canvas .lbl{font-size:14px}
#canvas .lbl.big{font-size:16.5px}

.zoomctl{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoomctl .btn{width:34px;height:34px;padding:0;border-radius:8px;font-size:17px;line-height:1;box-shadow:var(--shadow)}
.zoomctl .btn.txt{width:auto;padding:0 10px;font-size:12px}

.legend{position:absolute;left:16px;bottom:16px;z-index:2;background:color-mix(in srgb, var(--surface) 92%, transparent);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font-size:11.5px;color:var(--muted);display:grid;gap:4px;max-width:calc(100% - 32px)}
.legend .row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.legend .lbl{font-weight:700;color:var(--ink);min-width:4.5em}
.legend .foldsw{width:13px;height:13px;border-radius:50%;border:1.2px dashed var(--muted);display:inline-block}

.panel{position:absolute;right:16px;top:16px;bottom:16px;width:min(390px,calc(100% - 32px));overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px 16px;z-index:2}
.panel .phead{display:flex;align-items:flex-start;gap:8px}
.panel .crumb{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;flex:1;min-width:0}
.panel .crumb button{font:inherit;font-size:12px;border:0;background:none;color:var(--accent);padding:0;cursor:pointer}
.panel .crumb button:hover{text-decoration:underline}
.panel .close{font-size:16px;width:28px;height:28px;padding:0;border-radius:6px;flex:none}
.panel h2{font-size:19px;margin:6px 0 0}
.panel .q{margin:8px 0 6px;font-size:14px}
.panel .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.panel h3{font-family:inherit;font-size:12.5px;color:var(--muted);font-weight:700;margin:12px 0 6px}
.panel .more{margin-top:12px;font-size:12.5px}

.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:var(--bg)}
.hint{position:absolute;right:16px;bottom:16px;z-index:1;font-size:11.5px;color:var(--muted);background:color-mix(in srgb, var(--surface) 88%, transparent);border:1px solid var(--rule);border-radius:6px;padding:4px 10px}

@media (max-width: 760px){
  .topbar h1{font-size:16px}
  .topbar .meta{margin-left:0;width:100%}
  .ctrl input{width:8em}
  .panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:58%}
  .legend,.hint{display:none}
  .zoomctl{left:10px;top:10px}
}
@media print{
  @page{size:A3 landscape;margin:10mm}
  html,body{height:auto;overflow:visible}
  .topbar .ctrl,.topbar .meta,.topbar .nav,.zoomctl,.panel,.hint,.overlay{display:none!important}
  .stage{height:250mm}
  .legend{position:absolute;display:grid!important}
}
</style>
</head>
<body>
<header class="topbar">
  <h1>@omfy 論点マップ</h1>
  <nav class="nav" aria-label="画面の切り替え">
    <a href="overview.html" aria-current="page">俯瞰ビュー</a><a href="index.html" id="toDetail">詳細ビュー</a>
  </nav>
  <div class="ctrl"><span>形</span>
    <span class="seg" role="group" aria-label="マップの形">
      <button class="btn" id="lyRadial" aria-pressed="true">放射状</button><button class="btn" id="lyVertical" aria-pressed="false">縦</button>
    </span>
  </div>
  <div class="ctrl"><label for="depthSel">表示する深さ</label><select id="depthSel"></select></div>
  <div class="ctrl"><label for="searchBox">検索</label><input id="searchBox" type="search" placeholder="論点名・問い" autocomplete="off"></div>
  <div class="meta" id="metaLine">読み込み中…</div>
</header>

<div class="stage" id="stage">
  <svg id="canvas" role="img" aria-label="論点の構造を一枚で示すマップ"><g id="vp"></g></svg>

  <div class="zoomctl" aria-label="表示の操作">
    <button class="btn" id="zIn" title="拡大" aria-label="拡大">＋</button>
    <button class="btn" id="zOut" title="縮小" aria-label="縮小">−</button>
    <button class="btn txt" id="zFit" title="全体を表示">全体</button>
    <button class="btn txt" id="btnPrint" title="印刷（A3 横）">印刷</button>
  </div>

  <div class="legend" id="legend" hidden>
    <div class="row"><span class="lbl">種別</span>
      <span class="legend-k"><i class="sw" style="background:var(--k-objective)"></i>目的</span>
      <span class="legend-k"><i class="sw" style="background:var(--k-theme)"></i>テーマ</span>
      <span class="legend-k"><i class="sw" style="background:var(--k-criterion)"></i>評価軸</span>
      <span class="legend-k"><i class="sw" style="background:var(--k-object)"></i>対象</span>
      <span class="legend-k"><i class="sw" style="background:var(--k-context)"></i>外部環境</span>
      <span class="legend-k"><i class="sw" style="background:var(--k-issue)"></i>問い</span>
    </div>
    <div class="row"><span class="lbl">意見の印</span>
      <span class="legend-k"><i class="sw round" style="background:var(--st-support)"></i>賛成</span>
      <span class="legend-k"><i class="sw round" style="background:var(--st-cond)"></i>条件付き</span>
      <span class="legend-k"><i class="sw round" style="background:var(--st-neutral)"></i>中立</span>
      <span class="legend-k"><i class="sw round" style="background:var(--st-question)"></i>問い</span>
      <span class="legend-k"><i class="sw round" style="background:var(--st-oppose)"></i>反対</span>
    </div>
    <div class="row"><span class="lbl">その他</span>
      <span class="legend-k"><i class="foldsw"></i>下位論点を折りたたみ中（数字は件数）</span>
      <span>CC BY 4.0</span>
    </div>
  </div>

  <div class="hint" id="hint" hidden>ホイールで拡大縮小 ／ ドラッグで移動 ／ 論点をクリックで詳細</div>

  <aside class="panel" id="panel" hidden aria-live="polite"></aside>

  <div class="overlay" id="overlay"><div class="state" id="stateMsg">データを取得しています…</div></div>
</div>

<script>
(function(){
'use strict';
const O = window.OMFY;
const NS = 'http://www.w3.org/2000/svg';
const RING = 112;        // 放射状: 深さ 1 段あたりの半径
const V_COL = 30, V_ROW = 150;  // 縦: 葉の間隔、段の間隔
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let DATA = null, SELECTED = null, LAYOUT = 'radial', MAXD = 99, TERM = '', GROUP = 'role';
const view = { k: 1, tx: 0, ty: 0 };
const svg = document.getElementById('canvas');
const vp = document.getElementById('vp');
const panel = document.getElementById('panel');

function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs){ if(k==='text') e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); } if(parent) parent.appendChild(e); return e; }

// ---------------------------------------------------------------- layout
// 表示する深さ（MAXD）より深い論点は折りたたみ、その親を葉として扱う
function prepareVisible(){
  (function walk(n){
    n._open = n.depth < MAXD;
    n._vis = n._open ? n.children : [];
    n._leaves = n._vis.length ? n._vis.reduce((a,c)=>a+walk(c),0) : 1;
    return n._leaves;
  })(DATA.tree.root);
}
function visibleNodes(){ const out=[]; (function w(n){ out.push(n); n._vis.forEach(w); })(DATA.tree.root); return out; }

function layoutRadial(){
  (function place(n, a0, a1){
    n._a = (a0 + a1) / 2;
    const r = n.depth * RING;
    n._x = Math.cos(n._a) * r;
    n._y = Math.sin(n._a) * r;
    let a = a0;
    n._vis.forEach(c => { const w = (a1 - a0) * c._leaves / n._leaves; place(c, a, a + w); a += w; });
  })(DATA.tree.root, -Math.PI/2, Math.PI*1.5);
}
function layoutVertical(){
  let col = 0;
  (function place(n){
    if(!n._vis.length){ n._x = col * V_COL; col++; }
    else { n._vis.forEach(place); n._x = (n._vis[0]._x + n._vis[n._vis.length-1]._x) / 2; }
    n._y = n.depth * V_ROW;
  })(DATA.tree.root);
  const shift = DATA.tree.root._x;
  visibleNodes().forEach(n => { n._x -= shift; });
}
function doLayout(){ prepareVisible(); if(LAYOUT==='radial') layoutRadial(); else layoutVertical(); }

// ---------------------------------------------------------------- render
function isMatch(n){ return TERM && (n.label.indexOf(TERM) >= 0 || n.question.indexOf(TERM) >= 0); }

function badges(g, x, y, ops, dx, dy){
  const c = O.countStances(ops); const keys = O.STANCES.filter(s=>c[s]>0);
  keys.forEach((s,i) => { const off=(i-(keys.length-1)/2)*8; el('circle',{cx:x+dx*off, cy:y+dy*off, r:3.8, fill:O.stanceColor(s), class:'badge'}, g); });
}

function render(){
  while (vp.firstChild) vp.removeChild(vp.firstChild);
  const nodes = visibleNodes();
  const gRing = el('g', {}, vp), gE = el('g', {}, vp), gN = el('g', {}, vp);
  const anyMatch = !!TERM;

  if (LAYOUT === 'radial') {
    const dm = Math.max(...nodes.map(n=>n.depth));
    for (let d = 1; d <= dm; d++) el('circle', {cx:0, cy:0, r:d*RING, class:'ring'}, gRing);
  }

  nodes.forEach(p => p._vis.forEach(c => {
    let d;
    if (LAYOUT === 'radial') {
      if (p.depth === 0) d = 'M0,0 L' + c._x + ',' + c._y;
      else { const rm = (p.depth + c.depth) / 2 * RING; const mx = Math.cos(c._a) * rm, my = Math.sin(c._a) * rm; d = 'M' + p._x + ',' + p._y + ' Q' + mx + ',' + my + ' ' + c._x + ',' + c._y; }
    } else {
      const my = (p._y + c._y) / 2; d = 'M' + p._x + ',' + p._y + ' C' + p._x + ',' + my + ' ' + c._x + ',' + my + ' ' + c._x + ',' + c._y;
    }
    el('path', {d, class:'edge' + (anyMatch && !isMatch(c) ? ' dim' : '')}, gE);
  }));

  nodes.forEach(n => drawNode(gN, n, anyMatch));
  applyView();
}

function drawNode(parent, n, anyMatch){
  const folded = n.children.length && !n._open;
  const ops = folded ? O.subtreeOpinions(n) : n.opinions;
  const match = isMatch(n);
  const cls = 'node' + (n.id === SELECTED ? ' selected' : '') + (anyMatch ? (match ? ' match' : ' dim') : '');
  const title = n.label + '（' + n.kind + '）' + (ops.length ? ' 意見 ' + ops.length + ' 件' : '') + (folded ? ' 下位 ' + O.descendantCount(n) + ' 件を折りたたみ中' : '');
  const g = el('g', {class:cls, tabindex:'0', role:'button', 'aria-label':title}, parent);
  el('title', {text:title}, g);
  g.addEventListener('click', (e) => { if (justDragged) return; e.stopPropagation(); select(n.id, true); });
  g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(n.id, true); } });

  const r = n.depth === 0 ? 11 : n.depth === 1 ? 8.5 : n.depth === 2 ? 7 : 5.5;
  const x = n._x, y = n._y;
  if (folded) {
    el('circle', {cx:x, cy:y, r:r+5, class:'fold'}, g);
  }
  el('circle', {cx:x, cy:y, r, fill:O.kindColor(n.kind), class:'core'}, g);

  const big = n.depth <= 1 ? ' big' : '';
  const leafLike = !n._vis.length;

  if (LAYOUT === 'radial') {
    const ca = Math.cos(n._a), sa = Math.sin(n._a);
    if (n.depth === 0) {
      el('text', {x, y:y+r+21, 'text-anchor':'middle', class:'lbl big halo', text:n.label}, g);
      if (ops.length) badges(g, x, y+r+34, ops, 1, 0);
    } else if (leafLike) {
      const flip = ca < 0, deg = n._a * 180 / Math.PI;
      const off = r + (folded ? 9 : 5);
      const lx = x + ca * off, ly = y + sa * off;
      el('text', {x:lx, y:ly, class:'lbl halo' + big, 'dominant-baseline':'middle', 'text-anchor':flip?'end':'start', transform:'rotate(' + (flip ? deg+180 : deg) + ' ' + lx + ' ' + ly + ')', text:n.label + (folded ? '  +' + O.descendantCount(n) : '')}, g);
      if (ops.length) badges(g, x - ca*(r+8), y - sa*(r+8), ops, -sa, ca);
    } else {
      const up = sa < -0.2;
      el('text', {x, y: up ? y-r-8 : y+r+18, 'text-anchor':'middle', class:'lbl halo' + big, text:n.label}, g);
      if (ops.length) badges(g, x, up ? y+r+9 : y-r-9, ops, 1, 0);
    }
  } else {
    if (leafLike && n.depth > 0) {
      el('text', {x:x, y:y+r+6, class:'lbl halo', 'writing-mode':'tb', text:n.label + (folded ? ' +' + O.descendantCount(n) : '')}, g);
      if (ops.length) badges(g, x+14, y+r+6+n.label.length*14+6, ops, 0, 1);
    } else {
      el('text', {x, y:y-r-8, 'text-anchor':'middle', class:'lbl halo' + big, text:n.label}, g);
      if (ops.length) badges(g, x, y+r+10, ops, 1, 0);
    }
  }
}

// ---------------------------------------------------------------- view (pan / zoom)
function applyView(){ vp.setAttribute('transform', 'translate(' + view.tx + ',' + view.ty + ') scale(' + view.k + ')'); }
const clampK = (k) => Math.min(4, Math.max(0.15, k));

function area(){
  const r = svg.getBoundingClientRect();
  const a = { x:0, y:0, w:r.width, h:r.height };
  if (!panel.hidden) {
    if (window.innerWidth > 760) a.w -= panel.offsetWidth + 32;
    else a.h -= panel.offsetHeight + 20;
  }
  return a;
}

function fit(animate){
  const b = vp.getBBox();
  if (!b.width || !b.height) return;
  const a = area(), pad = 40;
  const k = clampK(Math.min((a.w - pad*2) / b.width, (a.h - pad*2) / b.height, 1.6));
  const to = { k, tx: a.x + a.w/2 - (b.x + b.width/2) * k, ty: a.y + a.h/2 - (b.y + b.height/2) * k };
  go(to, animate);
}

function focusNode(n){
  const a = area();
  const k = clampK(Math.max(view.k, 1.25));
  go({ k, tx: a.x + a.w/2 - n._x * k, ty: a.y + a.h/2 - n._y * k }, true);
}

let anim = null;
function go(to, animate){
  if (anim) cancelAnimationFrame(anim);
  if (!animate || reduceMotion) { Object.assign(view, to); applyView(); return; }
  const from = { ...view }, t0 = performance.now(), dur = 380;
  const ease = (t) => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  (function step(now){
    const p = Math.min(1, (now - t0) / dur), e = ease(p);
    view.k = from.k + (to.k - from.k) * e; view.tx = from.tx + (to.tx - from.tx) * e; view.ty = from.ty + (to.ty - from.ty) * e;
    applyView();
    if (p < 1) anim = requestAnimationFrame(step); else anim = null;
  })(t0);
}

function zoomAt(px, py, f){
  const k2 = clampK(view.k * f), s = k2 / view.k;
  view.tx = px - (px - view.tx) * s; view.ty = py - (py - view.ty) * s; view.k = k2;
  applyView();
}

svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
}, { passive:false });

let drag = null, justDragged = false;
svg.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  drag = { x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty, moved:false };
});
window.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  if (!drag.moved) { drag.moved = true; svg.classList.add('dragging'); if (anim) { cancelAnimationFrame(anim); anim = null; } }
  view.tx = drag.tx + dx; view.ty = drag.ty + dy; applyView();
});
window.addEventListener('pointerup', () => {
  if (!drag) return;
  if (drag.moved) { justDragged = true; setTimeout(() => { justDragged = false; }, 0); }
  svg.classList.remove('dragging');
  drag = null;
});

document.getElementById('zIn').addEventListener('click', () => { const a = area(); zoomAt(a.x + a.w/2, a.y + a.h/2, 1.3); });
document.getElementById('zOut').addEventListener('click', () => { const a = area(); zoomAt(a.x + a.w/2, a.y + a.h/2, 1/1.3); });
document.getElementById('zFit').addEventListener('click', () => fit(true));
document.getElementById('btnPrint').addEventListener('click', () => {
  const wasOpen = !panel.hidden; panel.hidden = true; fit(false);
  setTimeout(() => { window.print(); if (wasOpen) { panel.hidden = false; } }, 50);
});

// ---------------------------------------------------------------- panel
function select(id, focus){
  const n = DATA.tree.byId[id];
  if (!n) return;
  SELECTED = id;
  // 折りたたまれた深さにある論点なら、見えるところまで深さを広げる
  if (n.depth > MAXD) { MAXD = n.depth; syncDepthSel(); doLayout(); }
  O.writeHashId(id);
  document.getElementById('toDetail').href = 'index.html#n=' + encodeURIComponent(id);
  panel.hidden = false;
  renderPanel();
  render();
  if (focus) focusNode(n);
}

function closePanel(){
  panel.hidden = true; SELECTED = null; O.writeHashId(null);
  document.getElementById('toDetail').href = 'index.html';
  render();
}

function renderPanel(){
  const n = DATA.tree.byId[SELECTED]; if (!n) return;
  const E = O.escapeHtml;
  const path = O.pathOf(n);
  const crumbs = path.slice(0, -1).map(p => '<button data-id="' + E(p.id) + '">' + E(p.label) + '</button><span>›</span>').join('');
  const kids = n.children.map(c => {
    const cnt = O.subtreeOpinions(c).length;
    return '<button class="chip" data-id="' + E(c.id) + '"><span class="dot" style="background:' + O.kindColor(c.kind) + '"></span>' + E(c.label) + (cnt ? ' <span style="color:var(--muted)">' + cnt + '</span>' : '') + '</button>';
  }).join('');
  const below = O.subtreeOpinions(n).length - n.opinions.length;
  panel.innerHTML =
    '<div class="phead"><div class="crumb">' + (crumbs || '<span>最上位</span>') + '</div>' +
    '<button class="btn close" id="pClose" aria-label="パネルを閉じる" title="閉じる">×</button></div>' +
    '<h2>' + E(n.label) + ' <span class="chip" style="vertical-align:middle;margin-left:4px"><span class="dot" style="background:' + O.kindColor(n.kind) + '"></span>' + E(n.kind) + '</span></h2>' +
    '<p class="q"><strong>問い:</strong> ' + E(n.question || '（未記入）') + '</p>' +
    '<div class="chips">' + O.criteriaChipsHtml(n) + '</div>' +
    (kids ? '<h3>下位の論点（' + n.children.length + '）' + (below ? ' ／ 下位への意見 ' + below + ' 件' : '') + '</h3><div class="chips">' + kids + '</div>' : '') +
    '<h3>この論点への意見</h3>' +
    O.writeLinkHtml(n) +
    '<div class="gbar"><span>' + n.opinions.length + ' 件 ／ 並べ方:</span><span class="seg"><button class="btn" data-g="role" aria-pressed="' + (GROUP==='role') + '">記入者属性別</button><button class="btn" data-g="stance" aria-pressed="' + (GROUP==='stance') + '">立場別</button></span></div>' +
    O.opinionsHtml(n, GROUP, DATA.roles) +
    '<div class="more"><a href="index.html#n=' + encodeURIComponent(n.id) + '">この論点を詳細ビューで開く</a></div>';
  panel.querySelector('#pClose').addEventListener('click', closePanel);
  panel.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => select(b.dataset.id, true)));
  panel.querySelectorAll('.gbar .btn').forEach(b => b.addEventListener('click', () => { GROUP = b.dataset.g; renderPanel(); }));
}

// ---------------------------------------------------------------- controls
function syncDepthSel(){ document.getElementById('depthSel').value = String(MAXD >= DATA.tree.maxDepth ? 99 : MAXD); }

function setLayout(ly){
  LAYOUT = ly;
  document.getElementById('lyRadial').setAttribute('aria-pressed', String(ly==='radial'));
  document.getElementById('lyVertical').setAttribute('aria-pressed', String(ly==='vertical'));
  doLayout(); render(); fit(true);
}
document.getElementById('lyRadial').addEventListener('click', () => setLayout('radial'));
document.getElementById('lyVertical').addEventListener('click', () => setLayout('vertical'));

document.getElementById('depthSel').addEventListener('change', (e) => {
  MAXD = Number(e.target.value);
  const s = SELECTED && DATA.tree.byId[SELECTED];
  if (s && s.depth > MAXD) { panel.hidden = true; SELECTED = null; O.writeHashId(null); }
  doLayout(); render(); fit(true);
});

const search = document.getElementById('searchBox');
search.addEventListener('input', () => { TERM = search.value.trim(); render(); });
search.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !TERM) return;
  const hit = DATA.tree.nodes.find(isMatch);
  if (hit) select(hit.id, true);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !panel.hidden && document.activeElement !== search) closePanel();
});
let rt = null;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => fit(false), 150); });

// ---------------------------------------------------------------- start
async function main(){
  try {
    DATA = await O.loadAll();
    const T = DATA.tree;
    const sel = document.getElementById('depthSel');
    sel.innerHTML = '<option value="99">すべて</option>' + Array.from({length:T.maxDepth}, (_, i) => '<option value="' + (i+1) + '">' + (i+1) + ' 段まで</option>').join('');
    const ex = DATA.opinions.filter(o=>o.isExample).length;
    document.getElementById('metaLine').innerHTML =
      '<span>論点 ' + T.nodes.length + ' 件 ／ 意見 ' + DATA.opinions.length + ' 件' + (ex ? '（うちサンプル ' + ex + ' 件）' : '') + '</span>' +
      '<span>取得 ' + O.nowJST() + '</span><button class="btn" id="reload">再読み込み</button>';
    document.getElementById('reload').addEventListener('click', () => location.reload());
    document.getElementById('overlay').hidden = true;
    document.getElementById('legend').hidden = false;
    document.getElementById('hint').hidden = false;
    doLayout(); render(); fit(false);
    const fromHash = O.readHashId();
    if (fromHash && T.byId[fromHash]) select(fromHash, true);
  } catch (err) {
    const m = document.getElementById('stateMsg');
    m.className = 'state err';
    m.innerHTML = 'データの取得に失敗しました。<br>' + O.escapeHtml(err.message || String(err)) +
      '<br><br>公開用スプレッドシートが「ファイル → 共有 → ウェブに公開」の状態か確認してください。<br><button class="btn" id="retry" style="margin-top:10px">再試行</button>';
    document.getElementById('retry').addEventListener('click', () => location.reload());
    document.getElementById('metaLine').textContent = '';
  }
}
main();
})();
</script>
</body>
</html>
