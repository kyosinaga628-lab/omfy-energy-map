<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@omfy 論点マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  color-scheme: light dark;
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E9EDF0; --ink:#1C2730; --muted:#5B6B76; --rule:#D3DBE1; --rule2:#BCC6CE;
  --accent:#2B4C7E; --accent-soft:#DCE5F2;
  --st-support:#2F6DB5; --st-cond:#2E9E8F; --st-neutral:#8A96A0; --st-question:#7E5EA8; --st-oppose:#D2622A;
  --k-objective:#2E3543; --k-theme:#5B6F93; --k-criterion:#7E8F57; --k-object:#9C6F46; --k-issue:#AEB9C4; --k-context:#8E6F9C;
  --warn:#D2622A; --ok:#2E9E8F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A1F; --surface:#1C232A; --surface2:#232C34; --ink:#E4E9EE; --muted:#98A5B1; --rule:#2F3A44; --rule2:#3D4A56;
    --accent:#8FB0E0; --accent-soft:#24344A;
    --st-support:#7FA9E6; --st-cond:#63C2B3; --st-neutral:#9AA6B0; --st-question:#B093D8; --st-oppose:#E8925F;
    --k-objective:#C9D2DE; --k-theme:#7F93B8; --k-criterion:#A3B57A; --k-object:#C0906A; --k-issue:#55636F; --k-context:#AE93B8;
  }
}
:root[data-theme="dark"]{
  --bg:#141A1F; --surface:#1C232A; --surface2:#232C34; --ink:#E4E9EE; --muted:#98A5B1; --rule:#2F3A44; --rule2:#3D4A56;
  --accent:#8FB0E0; --accent-soft:#24344A;
  --st-support:#7FA9E6; --st-cond:#63C2B3; --st-neutral:#9AA6B0; --st-question:#B093D8; --st-oppose:#E8925F;
  --k-objective:#C9D2DE; --k-theme:#7F93B8; --k-criterion:#A3B57A; --k-object:#C0906A; --k-issue:#55636F; --k-context:#AE93B8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.7;padding-inline:clamp(12px,3vw,28px);padding-block:0 40px}
h1,h2,h3{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;margin:0;text-wrap:balance}
code{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:.9em;background:var(--surface2);padding:1px 5px;border-radius:3px}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto}
header{padding-block:20px 12px;border-bottom:1px solid var(--rule2);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
header h1{font-size:22px}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.meta button{font:inherit;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--rule2);background:var(--surface);color:var(--ink);cursor:pointer}
.meta button:hover{border-color:var(--accent)}
.legendbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:12px 0;padding:9px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;font-size:12px;color:var(--muted)}
.legendbar .lbl{font-weight:700;color:var(--ink)}
.legendbar .k{display:inline-flex;align-items:center;gap:5px}
.legendbar .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.legendbar .sw.round{border-radius:50%;width:9px;height:9px}
.legendbar .sep{width:1px;height:16px;background:var(--rule2)}
.viewtoggle{display:inline-flex;border:1px solid var(--rule2);border-radius:999px;overflow:hidden;margin-left:6px}
.viewtoggle button{font:inherit;font-size:12px;padding:4px 12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.viewtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main.app{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:0;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface);margin-top:10px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
.tree{border-right:1px solid var(--rule);padding:10px 8px;font-size:13px;overflow:auto;max-height:640px}
.tree svg{display:block;max-width:100%;height:auto}
.tree.vertical{overflow-x:auto}
.tree.vertical svg{min-width:900px}
svg text{font-family:"Zen Kaku Gothic New",sans-serif;fill:var(--ink)}
svg .edge{fill:none;stroke:var(--rule2);stroke-width:1.2}
svg .node{cursor:pointer}
svg .node circle.core{stroke:var(--surface);stroke-width:1.5}
svg .node.selected circle.core{stroke:var(--ink);stroke-width:2.5}
svg .lbl{font-size:11px}
svg .lbl.big{font-size:12.5px;font-weight:700}
svg .halo{stroke:var(--surface);stroke-width:3;paint-order:stroke;stroke-linejoin:round}
svg .badge{stroke:var(--surface);stroke-width:1}
.panel{padding:16px 20px;min-width:0}
.panel .crumb{font-size:12px;color:var(--muted)}
.panel h2{font-size:19px;margin:4px 0 0}
.panel .q{margin:8px 0 6px;font-size:14px}
.panel .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--rule2);background:var(--surface)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.gbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.gbar button{font:inherit;font-size:12.5px;padding:3px 11px;border-radius:999px;border:1px solid var(--rule2);background:var(--surface);color:var(--ink);cursor:pointer}
.gbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp{background:var(--surface2);border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-bottom:10px}
.grp-h{padding:6px 10px;font-size:12.5px;font-weight:700;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
.grp-h .n{font-weight:400;color:var(--muted)}
.op{padding:9px 10px;border-bottom:1px solid var(--rule);font-size:13px;background:var(--surface)}
.op:last-child{border-bottom:0}
.op .claim{font-weight:500}
.op .meta2{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11px;color:var(--muted);margin-top:4px;align-items:center}
.op .meta2 .st{padding:0 7px;border-radius:3px;font-weight:700}
.op .meta2 .au{margin-left:auto}
.op.example{opacity:.85}
.op.example .claim::after{content:" (サンプル)"; font-weight:400; color:var(--muted); font-size:11px}
.empty{padding:14px 10px;font-size:12.5px;color:var(--muted)}
section.matrices{margin-top:22px}
section.matrices h2{font-size:18px;margin-bottom:8px}
.scroll{overflow-x:auto;margin:10px 0;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
th{background:var(--surface2);font-weight:700;font-size:11.5px}
td.cnt{text-align:center;font-variant-numeric:tabular-nums}
td.cnt span{display:inline-block;min-width:26px;padding:1px 6px;border-radius:4px}
.zero{color:var(--rule2)}
.qa{margin-top:18px;padding:12px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.qa h3{font-size:14px;margin-bottom:6px}
.qa ul{margin:4px 0;padding-left:1.3em;font-size:13px}
.qa.ok{border-color:var(--ok)}
.state{padding:40px 10px;text-align:center;color:var(--muted)}
.state.err{color:var(--warn)}
footer{margin-top:24px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
@media (max-width: 860px){ main.app{grid-template-columns:1fr} .tree{border-right:0;border-bottom:1px solid var(--rule);max-height:320px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>@omfy 論点マップ</h1>
    <div class="meta" id="metaLine">読み込み中…</div>
  </header>

  <div class="legendbar" id="legendbar" hidden>
    <span class="lbl">種別</span>
    <span class="k"><i class="sw" style="background:var(--k-objective)"></i>目的</span>
    <span class="k"><i class="sw" style="background:var(--k-theme)"></i>テーマ</span>
    <span class="k"><i class="sw" style="background:var(--k-criterion)"></i>評価軸</span>
    <span class="k"><i class="sw" style="background:var(--k-object)"></i>対象</span>
    <span class="k"><i class="sw" style="background:var(--k-context)"></i>外部環境</span>
    <span class="k"><i class="sw" style="background:var(--k-issue)"></i>問い</span>
    <span class="sep"></span>
    <span class="lbl">意見の印（立場）</span>
    <span class="k"><i class="sw round" style="background:var(--st-support)"></i>賛成</span>
    <span class="k"><i class="sw round" style="background:var(--st-cond)"></i>条件付き</span>
    <span class="k"><i class="sw round" style="background:var(--st-neutral)"></i>中立</span>
    <span class="k"><i class="sw round" style="background:var(--st-question)"></i>問い</span>
    <span class="k"><i class="sw round" style="background:var(--st-oppose)"></i>反対</span>
    <span class="sep"></span>
    <span>表示:</span>
    <span class="viewtoggle" role="group" aria-label="ツリーの向き">
      <button id="btnH" aria-pressed="true">横（画面）</button><button id="btnV" aria-pressed="false">縦（印刷・発表）</button>
    </span>
  </div>

  <div id="loadingState" class="state">データを取得しています…</div>
  <div id="errorState" class="state err" hidden></div>

  <main class="app" id="app" hidden>
    <div class="tree" id="treePane"></div>
    <div class="panel" id="panel"></div>
  </main>

  <section class="matrices" id="matrices" hidden>
    <h2>抜けの確認（V5）</h2>
    <p style="font-size:13px;color:var(--muted);max-width:60em">(a) は論点 × 記入者属性。どの属性の声がどの論点に足りないかを見る。(b) は電源 × 3E+S。評価軸との関係が薄い電源を見る。</p>
    <div class="scroll"><table id="mxRole"></table></div>
    <div class="scroll"><table id="mxCrit"></table></div>
    <div class="qa" id="qa"></div>
  </section>

  <footer>
    <span>データは <a href="https://creativecommons.org/licenses/by/4.0/deed.ja">CC BY 4.0</a> で公開（出典表示で再利用可）</span>
    <span>意見は記入者個人の見解であり @omfy の公式見解ではない</span>
    <span><a href="https://github.com/">GitHub リポジトリ</a></span>
  </footer>
</div>

<script>
(function(){
'use strict';

// 公開用スプレッドシートの CSV 公開 URL（ウェブに公開 → CSV）。シートの構成を変えたらここも合わせる。
const CSV_URLS = {
  nodes: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlAW55KSksgmHytcuHjtNz_ovRS2_02lzsrIIlpJSHflrlonXEZ8Rs5FDoToE49oKs7zImGOjDh1w9/pub?gid=209843467&single=true&output=csv',
  opinions: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlAW55KSksgmHytcuHjtNz_ovRS2_02lzsrIIlpJSHflrlonXEZ8Rs5FDoToE49oKs7zImGOjDh1w9/pub?gid=732075855&single=true&output=csv',
  roles: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlAW55KSksgmHytcuHjtNz_ovRS2_02lzsrIIlpJSHflrlonXEZ8Rs5FDoToE49oKs7zImGOjDh1w9/pub?gid=198592258&single=true&output=csv',
};

const KIND_COLOR = {'目的':'var(--k-objective)','テーマ':'var(--k-theme)','評価軸':'var(--k-criterion)','対象':'var(--k-object)','問い':'var(--k-issue)','外部環境':'var(--k-context)'};
const STANCES = ['賛成','条件付き','中立','問い','反対'];
const STANCE_COLOR = {'賛成':'var(--st-support)','条件付き':'var(--st-cond)','中立':'var(--st-neutral)','問い':'var(--st-question)','反対':'var(--st-oppose)'};
const CRITERIA_COLS = ['安全性','安定供給','経済効率性','環境適合'];

let TREE = null, OPINIONS = [], ROLES = [], WARNINGS = [];
let SELECTED = null, VIEW = 'h', GROUP = 'role';

async function loadCSV(url){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status + ' で取得に失敗しました');
  const text = await res.text();
  const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
  return parsed.data;
}

function buildTree(rows){
  const nodes = rows.filter(r => r['ID'] && r['論点名（20字以内）'] && r['論点名（20字以内）'].trim())
    .map(r => ({
      id: r['ID'].trim(),
      label: r['論点名（20字以内）'].trim(),
      kind: (r['種別']||'').trim(),
      parentLabel: (r['親論点']||'').trim(),
      question: r['問い（〜か）'] || '',
      status: (r['状態']||'').trim(),
      flags: Object.fromEntries(CRITERIA_COLS.map(c => [c, (r[c]||'').trim() === '○'])),
      children: [],
      opinions: [],
    }));
  const byId = {}, byLabel = {};
  nodes.forEach(n => { byId[n.id] = n; if (byLabel[n.label]) WARNINGS.push('論点名が重複: 「' + n.label + '」'); byLabel[n.label] = n; });
  let root = null;
  nodes.forEach(n => {
    if (!n.parentLabel) { if (root) WARNINGS.push('親のない論点が複数あります: ' + n.label); root = root || n; return; }
    const p = byLabel[n.parentLabel];
    if (p) { p.children.push(n); n.parent = p; }
    else { WARNINGS.push('親論点「' + n.parentLabel + '」が見つかりません（' + n.label + '）'); }
  });
  if (root){
    (function walk(n, d){ n.depth = d; n.leaves = n.children.length ? n.children.reduce((a,c)=>a+walk(c,d+1),0) : 1; return n.leaves; })(root, 0);
  }
  return { byId, byLabel, root, nodes, maxDepth: Math.max(0, ...nodes.map(n=>n.depth||0)) };
}

function buildOpinions(rows){
  return rows.filter(r => r['主張（60字以内）'] && r['主張（60字以内）'].trim()).map(r => ({
    date: (r['記入日']||'').trim(),
    handle: (r['ハンドル']||'').trim(),
    nodeLabel: (r['論点']||'').trim(),
    role: (r['記入者属性']||'').trim(),
    stance: (r['立場']||'').trim(),
    basis: (r['根拠タイプ']||'').trim(),
    claim: r['主張（60字以内）'].trim(),
    note: (r['補足・出典（任意）']||'').trim(),
    isExample: (r['ハンドル']||'').trim().indexOf('@example_') === 0,
  }));
}

function buildRoles(rows){
  return rows.filter(r => r['属性（エネルギーに対する立場）'] && r['属性（エネルギーに対する立場）'].trim())
    .map(r => ({ name: r['属性（エネルギーに対する立場）'].trim(), desc: r['説明']||'', agg: r['集約先（任意）']||'', order: Number(r['並び順'])||999 }))
    .sort((a,b)=>a.order-b.order);
}

function attachOpinions(){
  OPINIONS.forEach(o => {
    const n = TREE.byLabel[o.nodeLabel];
    if (n) n.opinions.push(o);
    else WARNINGS.push('意見の論点名「' + o.nodeLabel + '」が論点シートに見つかりません（' + o.handle + '）');
  });
}

function stanceCounts(node){
  const c = {}; STANCES.forEach(s => c[s]=0);
  node.opinions.forEach(o => { if (c[o.stance] !== undefined) c[o.stance]++; });
  c.total = node.opinions.length;
  return c;
}

// ---------------- rendering: SVG helpers ----------------
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs){ if(k==='text') e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); } if(parent) parent.appendChild(e); return e; }
function badges(g, x, y, node, dx, dy){
  const c = stanceCounts(node); const keys = STANCES.filter(s=>c[s]>0);
  keys.forEach((s,i) => { const off=(i-(keys.length-1)/2)*8; el('circle',{cx:x+dx*off, cy:y+dy*off, r:3.6, fill:STANCE_COLOR[s], class:'badge'}, g); });
}
function nodeTitle(n){ const c = stanceCounts(n); return n.label + '（' + n.kind + '）' + (c.total ? ' 意見 ' + c.total + ' 件' : ''); }

function drawHorizontal(container){
  container.innerHTML = '';
  const svg = el('svg', {viewBox:'0 0 900 700', role:'img', 'aria-label':'左から右へ広がる論点ツリー'}, container);
  if(!TREE.root) return;
  const rowH=17, x0=30, colW=155, top=20; let row=0;
  (function place(n){ if(!n.children.length){ n.y=top+row*rowH; row++; } else { n.children.forEach(place); n.y=(n.children[0].y+n.children[n.children.length-1].y)/2; } n.x=x0+n.depth*colW; })(TREE.root);
  const H = Math.max(300, top+row*rowH+20);
  svg.setAttribute('viewBox', '0 0 880 ' + H);
  const g = el('g', {}, svg);
  TREE.nodes.forEach(n => { if(!n.parent) return; const p=n.parent; const mx=(p.x+n.x)/2; el('path',{d:'M'+p.x+','+p.y+' C'+mx+','+p.y+' '+mx+','+n.y+' '+n.x+','+n.y, class:'edge'}, g); });
  TREE.nodes.forEach(n => {
    const ng = el('g', {class:'node'+(n.id===SELECTED?' selected':'')}, g);
    ng.addEventListener('click', () => select(n.id));
    el('circle',{cx:n.x,cy:n.y,r:n.depth===0?7:5,fill:KIND_COLOR[n.kind]||'var(--muted)',class:'core'}, ng);
    el('title',{text:nodeTitle(n)}, ng);
    const isLeaf = !n.children.length;
    el('text',{x:n.x+(isLeaf?9:0), y:isLeaf?n.y:n.y-9, 'dominant-baseline':isLeaf?'middle':'auto','text-anchor':isLeaf?'start':'middle', class:'lbl halo'+(n.depth<=1?' big':''), text:n.label}, ng);
    const c = stanceCounts(n); if(c.total){ const bx = n.x+(isLeaf ? 9+n.label.length*10+8 : 0); badges(ng, isLeaf?bx:n.x, isLeaf?n.y:n.y+11, n, 1, 0); }
  });
}

function drawVertical(container){
  container.innerHTML = '';
  const svg = el('svg', {viewBox:'0 0 900 640', role:'img', 'aria-label':'上から下へ広がる論点ツリー'}, container);
  if(!TREE.root) return;
  const colW=26, rowH=110, x0=24, top=26; let col=0;
  (function place(n){ if(!n.children.length){ n.tx=x0+col*colW; col++; } else { n.children.forEach(place); n.tx=(n.children[0].tx+n.children[n.children.length-1].tx)/2; } n.ty=top+n.depth*rowH; })(TREE.root);
  const W = Math.max(700, x0+col*colW+10), H = top+(TREE.maxDepth)*rowH+120;
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);
  const g = el('g', {}, svg);
  TREE.nodes.forEach(n => { if(!n.parent) return; const p=n.parent; const my=(p.ty+n.ty)/2; el('path',{d:'M'+p.tx+','+p.ty+' C'+p.tx+','+my+' '+n.tx+','+my+' '+n.tx+','+n.ty, class:'edge'}, g); });
  TREE.nodes.forEach(n => {
    const ng = el('g', {class:'node'+(n.id===SELECTED?' selected':'')}, g);
    ng.addEventListener('click', () => select(n.id));
    el('circle',{cx:n.tx,cy:n.ty,r:n.depth===0?7:5,fill:KIND_COLOR[n.kind]||'var(--muted)',class:'core'}, ng);
    el('title',{text:nodeTitle(n)}, ng);
    const isLeaf = !n.children.length;
    if(isLeaf){
      el('text',{x:n.tx, y:n.ty+9, class:'lbl halo', 'writing-mode':'tb', 'text-anchor':'start', text:n.label}, ng);
      const c = stanceCounts(n); if(c.total) badges(ng, n.tx+11, n.ty+9+n.label.length*5.5+6, n, 0, 1);
    } else if(n.depth<=2){
      el('text',{x:n.tx, y:n.ty-10, 'text-anchor':'middle', class:'lbl halo'+(n.depth<=1?' big':''), text:n.label}, ng);
      const c = stanceCounts(n); if(c.total) badges(ng, n.tx, n.ty+12, n, 1, 0);
    } else {
      el('text',{x:n.tx, y:n.ty-9, class:'lbl halo', 'writing-mode':'tb', 'text-anchor':'end', text:n.label}, ng);
      const c = stanceCounts(n); if(c.total) badges(ng, n.tx+11, n.ty, n, 0, 1);
    }
  });
}

function renderTree(){
  const pane = document.getElementById('treePane');
  pane.className = 'tree' + (VIEW==='v' ? ' vertical' : '');
  if (VIEW === 'h') drawHorizontal(pane); else drawVertical(pane);
}

function renderPanel(){
  const panel = document.getElementById('panel');
  const n = TREE.byId[SELECTED];
  if(!n){ panel.innerHTML = '<div class="empty">左のツリーから論点を選んでください。</div>'; return; }
  const crumbs = []; let p = n; while(p){ crumbs.unshift(p.label); p = p.parent; }
  const links = CRITERIA_COLS.filter(c => n.flags[c]).map(c => '<span class="chip"><span class="dot"></span>'+c+'</span>').join('') || '<span style="font-size:12px;color:var(--muted)">（評価軸へのリンクなし）</span>';
  const ops = n.opinions;
  const opHtml = (o, showRole) => '<div class="op'+(o.isExample?' example':'')+'"><div class="claim">'+escapeHtml(o.claim)+'</div><div class="meta2"><span class="st" style="background:color-mix(in srgb, '+STANCE_COLOR[o.stance]+' 16%, var(--surface));color:'+STANCE_COLOR[o.stance]+'">'+o.stance+'</span><span>根拠: '+o.basis+'</span>'+(showRole?'<span>'+o.role+'</span>':'')+'<span class="au">'+escapeHtml(o.handle)+'</span></div></div>';
  let groups = '';
  if (GROUP === 'role'){
    ROLES.forEach(r => { const g = ops.filter(o=>o.role===r.name); if(!g.length) return; groups += '<div class="grp"><div class="grp-h"><span>'+r.name+'</span><span class="n">'+g.length+' 件</span></div>'+g.map(o=>opHtml(o,false)).join('')+'</div>'; });
    const other = ops.filter(o => !ROLES.some(r=>r.name===o.role));
    if (other.length) groups += '<div class="grp"><div class="grp-h"><span>属性未設定・その他</span><span class="n">'+other.length+' 件</span></div>'+other.map(o=>opHtml(o,false)).join('')+'</div>';
  } else {
    STANCES.forEach(s => { const g = ops.filter(o=>o.stance===s); if(!g.length) return; groups += '<div class="grp"><div class="grp-h"><span style="color:'+STANCE_COLOR[s]+'">'+s+'</span><span class="n">'+g.length+' 件</span></div>'+g.map(o=>opHtml(o,true)).join('')+'</div>'; });
  }
  if (!ops.length) groups = '<div class="empty">この論点への意見はまだありません。</div>';
  panel.innerHTML =
    '<div class="crumb">'+crumbs.map(escapeHtml).join(' › ')+'</div>'+
    '<h2>'+escapeHtml(n.label)+' <span class="chip" style="vertical-align:middle;margin-left:4px"><span class="dot" style="background:'+(KIND_COLOR[n.kind]||'var(--muted)')+'"></span>'+n.kind+'</span></h2>'+
    '<p class="q"><strong>問い:</strong> '+escapeHtml(n.question||'（未記入）')+'</p>'+
    '<div class="chips">'+links+'</div>'+
    '<div class="gbar"><span>意見 '+ops.length+' 件 ／ 並べ方:</span><button data-g="role" aria-pressed="'+(GROUP==='role')+'">記入者属性別</button><button data-g="stance" aria-pressed="'+(GROUP==='stance')+'">立場別</button></div>'+
    groups;
  panel.querySelectorAll('.gbar button').forEach(b => b.addEventListener('click', () => { GROUP = b.dataset.g; renderPanel(); }));
}

function select(id){ SELECTED = id; renderTree(); renderPanel(); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderMatrices(){
  const issues = TREE.nodes.filter(n => n.kind === '問い' || (n.kind === '評価軸' && n.depth === 3));
  let h = '<thead><tr><th>親</th><th>論点</th>' + ROLES.map(r=>'<th>'+r.name.replace(/（.*/,'')+'</th>').join('') + '<th>合計</th></tr></thead><tbody>';
  issues.forEach(n => {
    h += '<tr><td style="color:var(--muted);font-size:11.5px">'+ (n.parent?escapeHtml(n.parent.label):'') +'</td><td>'+escapeHtml(n.label)+'</td>';
    ROLES.forEach(r => { const v = n.opinions.filter(o=>o.role===r.name).length; const bg = v ? 'color-mix(in srgb, var(--accent) '+Math.min(14+v*22,80)+'%, var(--surface))' : 'transparent'; h += '<td class="cnt"><span style="background:'+bg+'" class="'+(v?'':'zero')+'">'+(v||'·')+'</span></td>'; });
    const total = n.opinions.length;
    h += '<td class="cnt '+(total?'':'zero')+'">'+(total||'·')+'</td></tr>';
  });
  document.getElementById('mxRole').innerHTML = h + '</tbody>';

  const srcNode = TREE.byLabel['電源・技術'];
  const objects = srcNode ? srcNode.children.filter(n=>n.kind==='対象') : [];
  let h2 = '<thead><tr><th>電源</th>' + CRITERIA_COLS.map(c=>'<th>'+c+'</th>').join('') + '<th>各論数</th></tr></thead><tbody>';
  objects.forEach(o => {
    h2 += '<tr><td>'+escapeHtml(o.label)+'</td>';
    CRITERIA_COLS.forEach(c => { const v = o.children.filter(ch=>ch.flags[c]).length; const bg = v ? 'color-mix(in srgb, var(--k-criterion) '+Math.min(15+v*25,85)+'%, var(--surface))' : 'transparent'; h2 += '<td class="cnt"><span style="background:'+bg+'" class="'+(v?'':'zero')+'">'+(v||'·')+'</span></td>'; });
    h2 += '<td class="cnt">'+o.children.length+'</td></tr>';
  });
  document.getElementById('mxCrit').innerHTML = h2 + '</tbody>';

  const qa = document.getElementById('qa');
  if (WARNINGS.length){
    qa.className = 'qa';
    qa.innerHTML = '<h3>データの点検（モデレータ向け）</h3><ul>' + WARNINGS.map(w=>'<li>'+escapeHtml(w)+'</li>').join('') + '</ul>';
  } else {
    qa.className = 'qa ok';
    qa.innerHTML = '<h3>データの点検（モデレータ向け）</h3><p style="margin:0;font-size:13px">問題は見つかりませんでした。</p>';
  }
}

async function main(){
  try {
    const [nodeRows, opRows, roleRows] = await Promise.all([loadCSV(CSV_URLS.nodes), loadCSV(CSV_URLS.opinions), loadCSV(CSV_URLS.roles)]);
    WARNINGS = [];
    TREE = buildTree(nodeRows);
    OPINIONS = buildOpinions(opRows);
    ROLES = buildRoles(roleRows);
    attachOpinions();
    if (!TREE.root) throw new Error('論点シートから木の根（親のない論点）が見つかりませんでした。');

    SELECTED = TREE.root.children[0] ? TREE.root.children[0].id : TREE.root.id;
    document.getElementById('loadingState').hidden = true;
    document.getElementById('legendbar').hidden = false;
    document.getElementById('app').hidden = false;
    document.getElementById('matrices').hidden = false;
    const exampleCount = OPINIONS.filter(o=>o.isExample).length;
    const now = new Date().toLocaleString('ja-JP', {timeZone:'Asia/Tokyo', hour12:false});
    document.getElementById('metaLine').innerHTML =
      '論点 '+TREE.nodes.length+' 件 ／ 意見 '+OPINIONS.length+' 件'+(exampleCount?'（うちサンプル '+exampleCount+' 件）':'')+
      ' ／ 取得 '+now+' JST <button id="reload">再読み込み</button>';
    document.getElementById('reload').addEventListener('click', () => location.reload());

    renderTree(); renderPanel(); renderMatrices();
  } catch (err) {
    document.getElementById('loadingState').hidden = true;
    const es = document.getElementById('errorState');
    es.hidden = false;
    es.innerHTML = 'データの取得に失敗しました。<br>' + escapeHtml(err.message || String(err)) +
      '<br><br>公開用スプレッドシートが「ウェブに公開」の状態か、ネットワーク接続を確認してください。<br>' +
      '<button id="retry" style="font:inherit;margin-top:10px;padding:6px 16px;border-radius:6px;border:1px solid var(--rule2);background:var(--surface);cursor:pointer">再試行</button>';
    document.getElementById('retry').addEventListener('click', () => location.reload());
  }
}

document.getElementById('btnH').addEventListener('click', function(){ VIEW='h'; this.setAttribute('aria-pressed','true'); document.getElementById('btnV').setAttribute('aria-pressed','false'); renderTree(); });
document.getElementById('btnV').addEventListener('click', function(){ VIEW='v'; this.setAttribute('aria-pressed','true'); document.getElementById('btnH').setAttribute('aria-pressed','false'); renderTree(); });

main();
})();
</script>
</body>
